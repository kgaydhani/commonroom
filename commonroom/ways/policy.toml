# The room's ways-of-working numbers (commonroom#217). They are read once, at import: a running dispatcher keeps the
# values it started with, and a missing file or name fails the import naming it.
# A project overrides a value under `[policy]` in its room.toml, with the same name; unset, it gets the value here.
# An unknown name, or one marked "room-wide only", is an error naming it when that project's dispatcher starts.
# `name = { value = ..., min = ..., max = ... }` sets a floor and ceiling: a project's value outside them is an error
# naming it at start, and so is the room's own (commonroom#230). Without them a value is any whole number from 0.
# Budget and gate settings are not here, except the owner's floor below: they stay in room.toml `[budget]`,
# `[breakers]`, `[parallel]`, `[owner]` and `[share]`, in the registry's `[budget]`, and in gate.py.

# Review and CI ------------------------------------------------------------------------------------------------------

# This many CHANGES verdicts on one PR go to the director, not back to the builder (commonroom#32).
review_rounds = { value = 2, min = 1 }
# This many INCOMPLETE verdicts at one head stop re-reviews and go to the director (commonroom#174).
incomplete_rounds = { value = 2, min = 1 }
# Red CI sends a PR back to its builder at most this often before the director steps in.
ci_bounces = { value = 3, min = 1 }
# Infrastructure cancellations are rerun at most this many times per run. Room-wide only for now (commonroom#228).
ci_reruns = 6
# Minutes between those reruns, growing 20, 40, 60..., so an outage can't use them all up. Room-wide only for now
# (commonroom#228).
ci_backoff_minutes = 20

# Pacing and sessions ------------------------------------------------------------------------------------------------

# Seconds (3 hours): a ready research task jumps the build queue at most this often.
scout_interleave_seconds = 10800
# Seconds (1 hour) between headless director runs on its ordinary triggers.
director_cooldown_seconds = 3600
# Seconds (15 minutes): a PR waiting only on the director's stamp is raised after this, not after the hourly cooldown
# (commonroom#434). Other reasons keep the hourly one.
stamp_cooldown_seconds = 900
# Seconds (5 minutes): new owner comments are answered after this, rather than after the director's hourly cooldown.
owner_cooldown_seconds = 300
# Minutes: an in-progress issue no run holds, unchanged this long, goes back to ready (commonroom#63).
stale_claim_minutes = 30
# Seconds (10 minutes): a task whose last run was a room-error rests this long, doubling with each one in a row
# (commonroom#9).
room_error_backoff_seconds = { value = 600, min = 60 }
# The third room-error in a row goes to the director (commonroom#9).
room_error_escalate = { value = 3, min = 1 }
# Seconds (12 hours): a stopped Claude session older than this starts fresh (commonroom#142).
resume_window_seconds = 43200
# Seconds (55 minutes, inside the prompt cache's hour): a finished build sent back by a review resumes its own
# session if it ended less than this ago; 0 turns it off (commonroom#208).
rework_resume_seconds = { value = 3300, min = 0 }
# Seconds (6 hours): the room's own work must have run this long in the 24h window before "nothing merged" is a
# verdict: after a long pause most of the window is pause time, and no build, review and merge cycle fits in the
# first hours back. Room-wide only: it is part of a breaker's timing (commonroom#230).
progress_min_work_seconds = 21600
# At most this many mention notifications per pass; the rest are summed up in one.
notify_max = 5
# Seconds (60 minutes) the room lets one run go; the headless note tells the worker the same number.
run_timeout_seconds = { value = 3600, min = 300, max = 14400 }

# Percent: scouting plus the director's own runs (not stamp-only ones) stay under this share of the project's input and
# output tokens over the last 7 days. Above it, no scout job and no periodic steer-only director run starts; escalations,
# owner comments and stamps still do (commonroom#440).
looking_max_percent = { value = 35, min = 0, max = 100 }

# The pie ------------------------------------------------------------------------------------------------------------

# Minutes: a project with a model run on a provider now, or one that ended this recently, is active there. A project
# over its line, or `spare`, starts only when the pie names it among the active projects and itself, so its share is
# lent only while the others are idle (commonroom#240). Today's `[share] idle_minutes`. Room-wide only: every
# project's dispatcher must judge "active" alike.
pie_idle_minutes = 60
# The owner is told once when a project's estimated spend passes its line by this many points, and again only after it
# has dropped back below its line by as many (or the week resets or a raise changes the line), so the estimate's own
# movement never repeats a notice (commonroom#243). Room-wide only.
pie_notice_margin = { value = 1, min = 0 }
# Minutes: an own session of the owner's counts as active this long after its last message (commonroom#243).
pie_own_active_minutes = { value = 20, min = 1 }

# Points of the week: the least a project in the pie's registry keeps back for the owner on each provider. Its weekly
# reserve is the part of the owner's slice (what the shares leave) he hasn't used, and never less than this, so the
# projects can't run the week out once his slice is used (axiom A5, commonroom#241). About a heavy day of his own use.
# Room-wide only: every project keeps back the same.
owner_floor_weekly = { value = 5, min = 1, max = 50 }

# The desk ------------------------------------------------------------------------------------------------------------

# Minutes (the prompt cache's hour): a prompt to an owner's session this long after its last answer finds the cache
# expired, so continuing rewrites the whole context (commonroom#367).
cold_return_minutes = { value = 60, min = 1 }
# Tokens: below this much context a cold return is cheap, and the hook says nothing (commonroom#367).
cold_return_context = { value = 150000, min = 1 }
# Hours: a handoff brief older than this is no longer offered to a new session; `room handoff list` still shows it (commonroom#384).
handoff_offer_hours = { value = 72, min = 1 }

# The room's own text (axiom A9) -------------------------------------------------------------------------------------
# Tokens count as characters divided by four, rounded up; tests/test_prompt_budget.py holds the text to them. Both are
# room-wide only: they limit the room's own text, which is the same for every project.

# The most tokens one rendered prompt may have: the room hands over the task and leaves the method to the model.
prompt_max_tokens = 700
# The most tokens commonroom/ways/prompts/, handshake/ and comments/ may have together, so new text replaces old instead of piling up.
templates_max_tokens = 3308   # 3308: build-blocked*.md replace build-incomplete.md, plus two comments (#515); the shared sentence is in one file; 3290: role-local.md (#455), the cap grew by the new template; 3200: the templates trimmed to 3100 tokens (#417), so about 100 tokens of headroom; 3342: compacted.md (#410), the cap grew by the new template; 3299: the correction clause in reply.md (#399); 3282: cold-return.md (#367); 3222: hands.md (#368); 3209: handoff-offer.md (#366); 3180: handoff.md (#363); 3122: review-room-tested.md (#335); 2640 + the 384 of comments/ (commonroom#223); 2640: the public-repo rule (#316); 3080: continue-rework.md (#208)

# The owner's person file (commonroom#573, docs/layer.md): one small file, `person.md` in the room home, one dated line
# per fact. Long instruction files and injected memory cost tokens and lower task success (#554), so the cap is
# enforced in code. Tokens are estimated as characters / 4. Room-wide only.
person_max_lines = { value = 60, min = 1 }
person_max_tokens = { value = 800, min = 1 }
