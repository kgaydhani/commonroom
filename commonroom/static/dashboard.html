<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P100 Common Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
/* Teletext (Ceefax P100). Eight hard colours on black, no boxes, colour bars as structure.
   Purely visual: same sections, same behaviour as before. */
:root{--k:#000;--r:#ff2a2a;--g:#2bff2b;--y:#ffff2b;--b:#2a2aff;--m:#ff2bff;--c:#2bffff;--w:#ffffff;--dim:#9a9a9a;
  --tt:"VT323","Courier New",monospace}
*{box-sizing:border-box;border-radius:0!important}
html,body{background:var(--k)}
body{margin:0;color:var(--w);font:400 22px/1.15 var(--tt);-webkit-font-smoothing:none}
a{color:var(--c);text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:14px 16px 70px}
.y{color:var(--y)} .c{color:var(--c)} .g{color:var(--g)} .m{color:var(--m)} .rd{color:var(--r)} .dim{color:var(--dim)}
.blk{display:inline-block;padding:0 8px;color:var(--k);font-weight:400}
.bg-g{background:var(--g)} .bg-y{background:var(--y)} .bg-c{background:var(--c)} .bg-m{background:var(--m)} .bg-r{background:var(--r);color:var(--w)} .bg-b{background:var(--b);color:var(--y)} .bg-w{background:var(--w)}
@keyframes flash{50%{visibility:hidden}} .flash{animation:flash 1s steps(1) infinite}

/* Header rows */
.row1{display:flex;justify-content:space-between;gap:12px;font-size:24px}
.title{background:var(--b);color:var(--y);margin:6px 0 8px;padding:2px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.title .big{font-size:40px;line-height:1;transform:scaleY(1.35);transform-origin:center;padding:6px 0;text-transform:uppercase;letter-spacing:.02em}
.title .proj{color:var(--c);font-size:20px}
.line{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0}
.blocks{display:inline-flex;gap:3px;vertical-align:middle}
.blocks i{display:inline-block;width:12px;height:16px;background:#1a1a1a}
.blocks i.on{background:var(--y)}

/* Layout */
.grid{display:grid;gap:18px 28px;margin-top:14px;grid-template-columns:minmax(0,1fr) 400px}
.side{display:grid;gap:18px;align-content:start}
.full{grid-column:1/-1}
@media (max-width:920px){.grid{grid-template-columns:1fr}}
section{background:none;border:0;padding:0;scroll-margin-top:10px}
h2{margin:0 0 8px;padding:1px 10px;font:400 26px/1.1 var(--tt);text-transform:uppercase;color:var(--k);display:flex;justify-content:space-between;align-items:center}
h2 .pg{font-size:20px}
#queueSec h2{background:var(--m)} #proofSec h2{background:var(--c)} #usageSec h2{background:var(--g)}
#liveSec h2{background:var(--y)} #runsSec h2{background:var(--w)} #boardSec h2{background:var(--r);color:var(--w)} #ctrlSec h2{background:var(--b);color:var(--y)}

/* Queue */
.task{padding:4px 0 6px}
.task summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.task summary::-webkit-details-marker{display:none}
.task summary::before{content:"\25B6";color:var(--k)}
.task summary:hover::before,.task[open] summary::before{color:var(--y)}
.task .num{color:var(--c)}
.task .title2{flex:1;min-width:200px;font-size:24px}
.task .due{color:var(--y)}
.reply-waiting{background:var(--m);color:var(--k);padding:0 6px}
.sent{color:var(--c)}
.brief{color:var(--c);white-space:pre-wrap;margin:6px 0 6px 22px;max-height:260px;overflow:auto;font-size:20px;line-height:1.15}
.msg{margin:4px 0 4px 22px;font-size:21px} .msg.you b{color:var(--c)} .msg.room b{color:var(--g)} .msg b{font-weight:400;margin-right:8px}
form.reply{display:flex;gap:10px;margin:8px 0 0 22px}
input{flex:1;min-width:0;font:400 22px var(--tt);background:var(--k);color:var(--w);border:0;border-bottom:3px solid var(--y);padding:4px 2px;outline:none}
input::placeholder{color:var(--dim)} input:focus{border-bottom-color:var(--c)}
button{font:400 22px var(--tt);border:0;padding:2px 14px;cursor:pointer;background:var(--y);color:var(--k);text-transform:uppercase}
button:hover{background:var(--c)} button:disabled{opacity:.5;cursor:default}
button.alt{background:var(--r);color:var(--w)}
.hint{color:var(--dim);font-size:19px;margin:4px 0 0 22px}
.empty{color:var(--dim);padding:4px 0}

/* Proof: dotted leaders, double-height numbers */
.lead{display:flex;align-items:baseline;gap:8px;margin:2px 0}
.lead .k{white-space:nowrap}
.lead .fill{flex:1;border-bottom:3px dotted #555;transform:translateY(-6px)}
.lead .v{font-size:34px;line-height:1;transform:scaleY(1.2)}

/* Allowance: mosaic bars */
.prov{margin-bottom:10px}
.prov .head{display:flex;justify-content:space-between;align-items:baseline}
.prov .why{color:var(--dim);font-size:19px;margin:0 0 4px}
.bar{position:relative;height:16px;background:repeating-linear-gradient(90deg,#1a1a1a 0 10px,var(--k) 10px 12px);margin:2px 0}
.bar>i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--g) 0 10px,var(--k) 10px 12px)}
.prov.codex .bar>i{background:repeating-linear-gradient(90deg,var(--c) 0 10px,var(--k) 10px 12px)}
.bar>b{position:absolute;top:-4px;bottom:-4px;width:4px;background:var(--y)}
.barlabel{display:flex;justify-content:space-between;font-size:19px;color:var(--dim)}

/* Live feed and runs */
.feedhead{color:var(--dim);font-size:19px;margin-bottom:4px}
pre.feed{margin:0;font:400 20px/1.15 var(--tt);color:var(--g);white-space:pre-wrap;max-height:300px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:21px}
td{padding:1px 10px 3px 0;vertical-align:top}
td.t{color:var(--dim);white-space:nowrap}
.st.done{color:var(--g)} .st.running{color:var(--y)} .st.failed,.st.blocked{color:var(--r)} .st.room-error{color:var(--dim)}
.out.none{color:var(--r)}
.role{color:var(--c);text-transform:uppercase}

/* Board */
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:920px){.cols{grid-template-columns:1fr 1fr}}
.col h3{margin:0 0 4px;padding:0 6px;font:400 22px var(--tt);text-transform:uppercase;color:var(--k);display:inline-block}
.col.ready h3{background:var(--g)} .col.prog h3{background:var(--y)} .col.review h3{background:var(--c)} .col.blocked h3{background:var(--r);color:var(--w)}
.card{font-size:20px;line-height:1.1;margin:3px 0}
.card .n{color:var(--c);margin-right:6px}
.col.blocked .card{color:var(--dim)}

/* Controls */
.ctrl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
.ctrl form{display:flex;gap:10px}
.breaker{color:var(--r);margin-top:6px}

/* Fastext bar */
.fastext{position:fixed;left:0;right:0;bottom:0;background:var(--k);display:flex;justify-content:center;gap:28px;padding:6px 10px;font-size:24px;border-top:2px solid #222}
.fastext a{text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <div class="row1"><span class="y">P100</span><span class="c">COMMON ROOM</span><span id="clock">--- -- --- --:--</span></div>
  <div class="title"><span class="big" id="projBig">Common Room</span><span class="proj" id="proj"></span></div>
  <div class="line"><span class="blk bg-y">GOAL</span><span id="goalName">-</span><span class="blocks" id="goalBlocks"></span><span class="c" id="goalMeta"></span></div>
  <div class="line" id="beacon"><span class="blk bg-y" id="beaconState">CHECKING</span><span id="beaconWhat"></span></div>

  <div class="grid">
    <section id="queueSec"><h2><span>Your queue · <span id="qcount">0</span></span><span class="pg">P201</span></h2><div id="queue"><div class="empty">Loading</div></div></section>
    <div class="side">
      <section id="proofSec"><h2><span>Proof · last 24h</span><span class="pg">P300</span></h2><div id="proof"></div></section>
      <section id="usageSec"><h2><span>Allowance</span><span class="pg">P400</span></h2><div id="usage"></div></section>
    </div>
    <section class="full" id="liveSec"><h2><span>Live</span><span class="pg">P500</span></h2><div class="feedhead" id="feedHead"></div><pre class="feed" id="feed"></pre></section>
    <section class="full" id="runsSec"><h2><span>Recent runs</span><span class="pg">P600</span></h2><table id="runs"></table></section>
    <section class="full" id="boardSec"><h2><span>Board</span><span class="pg">P700</span></h2><div class="cols" id="board"></div></section>
    <section class="full" id="ctrlSec"><h2><span>Suggestions and control</span><span class="pg">P800</span></h2>
      <div class="ctrl">
        <form id="suggest"><input name="title" placeholder="Suggest something. The director judges it on its merits"><button>Suggest</button></form>
        <div><button class="alt" id="pause">Pause autonomy</button></div>
      </div>
      <div id="breakers"></div>
    </section>
  </div>
</div>
<nav class="fastext"><a href="#queueSec" class="rd">Queue</a><a href="#runsSec" class="g">Runs</a><a href="#boardSec" class="y">Board</a><a href="#usageSec" class="c">Usage</a></nav>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{if(!t)return'-';const s=Math.max(0,Date.now()/1000-t);return s<90?Math.round(s)+'s':s<5400?Math.round(s/60)+'m':(s/3600).toFixed(1)+'h'};
const clock=t=>t?new Date(t*1000).toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit'}):'?';
const roleName={builder:'Builder',reviewer:'Reviewer',director:'Director',scout:'Scout',merge:'Merge',analyst:'Analyst',playtester:'Playtester'};
let pageVersion=null; const openItems=new Set();

function tick(){const d=new Date();$('clock').textContent=d.toLocaleDateString([],{weekday:'short',day:'2-digit',month:'short'})+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
setInterval(tick,1000);tick();

function blocks(el,frac,n=20){el.innerHTML=Array.from({length:n},(_,i)=>`<i class="${i<Math.round(frac*n)?'on':''}"></i>`).join('')}

function beacon(d){
  const run=d.running[0];
  const paused=d.breakers.find(b=>b.kind=='paused_by_owner'), breaker=d.breakers.find(b=>b.kind!='paused_by_owner');
  const allHeld=Object.values(d.usage).every(v=>!v.allowed);
  let label='IDLE',cls='bg-y',what='<span class="y">Nothing ready to run. Waiting for the next task or trigger.</span>';
  if(run){label=d.running.length>1?`NOW ×${d.running.length}`:'NOW';cls='bg-g';
    what=d.running.map(r=>`<span class="g">${esc((roleName[r.role]||r.role).toUpperCase())} ON ${esc(r.task||'-')}</span> <span class="dim">· ${esc(r.provider)} ${esc(r.model||'')} ·</span> <span class="g">${ago(r.started_at)}</span>`).join(' &nbsp;|&nbsp; ')+' <span class="g flash">█</span>'}
  else if(breaker){label='STOPPED';cls='bg-r';what=`<span class="rd">${esc(breaker.detail)}</span>`}
  else if(paused){label='PAUSED';cls='bg-r';what='<span class="rd">Autonomy paused from this page.</span>'}
  else if(allHeld){label='HELD';cls='bg-m';what=`<span class="m">${esc(Object.values(d.usage).map(v=>v.reason).join(' · '))}</span>`}
  $('beaconState').className='blk '+cls;$('beaconState').textContent=label;$('beaconWhat').innerHTML=what;
}

function renderQueue(q){
  const el=$('queue');
  if(!q||q.error||!q.length){$('qcount').textContent='0';el.innerHTML=q&&q.error?`<div class="rd">${esc(q.error)}</div>`:'<div class="empty">Nothing needs you right now.</div>';return}
  $('qcount').textContent=q.length;
  const a=document.activeElement;
  if(a&&a.tagName=='INPUT'&&el.contains(a)&&a.value)return; // don't redraw while you're mid-sentence
  const status=i=>{const last=i.comments[i.comments.length-1];if(!last)return'';
    return last.who=='agent'?'<span class="reply-waiting flash">! REPLY WAITING</span>':'<span class="sent">SENT · WITH THE DIRECTOR</span>'};
  el.innerHTML=q.map(i=>`<details class="task" data-n="${i.number}" ${openItems.has(i.number)?'open':''}>
    <summary><span class="num">#${i.number}</span><span class="title2">${esc(i.title.replace(/^\[You\]\s*/,''))}</span>${i.due?`<span class="due">DUE ${esc(i.due)}</span>`:''}${status(i)}</summary>
    <div class="brief">${esc(i.brief)}</div>
    ${i.comments.map(c=>`<div class="msg ${c.who=='you'?'you':'room'}"><b>${c.who=='you'?'YOU':'ROOM'}</b>${esc(c.body)}</div>`).join('')}
    <form class="reply" data-n="${i.number}"><input name="text" placeholder="Answer, question, or what you delivered"><button>Send</button></form>
    <div class="hint">If your reply completes the task, the director checks it and closes it. Otherwise it answers. <a href="${esc(i.url)}" target="_blank">GitHub</a></div>
  </details>`).join('');
  el.querySelectorAll('details').forEach(x=>x.ontoggle=()=>{const n=+x.dataset.n;x.open?openItems.add(n):openItems.delete(n)});
  el.querySelectorAll('form').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const t=f.text.value.trim();
    if(!t){f.text.placeholder='Write something first';return}
    const btn=f.querySelector('button');btn.disabled=true;
    const res=await post('/api/comment',{number:+f.dataset.n,text:t});btn.disabled=false;
    if(res.error){alert(res.error);return}
    f.text.value='';document.activeElement&&document.activeElement.blur();
    f.insertAdjacentHTML('beforebegin',`<div class="msg you"><b>YOU</b>${esc(t)} <span class="sent">SENT</span></div>`);
    setTimeout(refresh,1500)});
}

function renderProof(p){
  const rate=p.runs_24h?Math.round(100*p.productive_24h/p.runs_24h):0;
  const row=(k,v,cls)=>`<div class="lead"><span class="k">${k}</span><span class="fill"></span><span class="v ${cls}">${esc(v)}</span></div>`;
  $('proof').innerHTML=row('MERGED',p.merged_24h,'g')+row('RUNS WITH OUTPUT',p.runs_24h?rate+'%':'-',rate>=70?'g':'y')
    +row('MODEL RUNS',p.runs_24h,'w')+row('SINCE LAST MERGE',ago(p.last_merge_at),'c')
    +row('CLAUDE WEEKLY SPENT',p.weekly_spent_24h+'%','y')+row('FAILURES',p.failed_24h,p.failed_24h?'rd':'g');
}

function renderUsage(u){
  let h='';
  for(const [p,v] of Object.entries(u)){
    h+=`<div class="prov ${p}"><div class="head"><span class="${p=='claude'?'g':'c'}">${p.toUpperCase()}</span><span class="blk ${v.allowed?'bg-g':'bg-m'}">${v.allowed?'GO':'HOLD'}</span></div><div class="why">${esc(v.reason)}</div>`;
    for(const w of ['five_hour','seven_day']){const x=v.windows[w];if(!x)continue;const cap=w=='seven_day'?v.detail.weekly_pace:v.detail.five_hour_cap;
      h+=`<div class="bar"><i style="width:${Math.min(100,x.used_pct)}%"></i>${cap!=null?`<b style="left:${Math.min(100,cap)}%" title="pace limit"></b>`:''}</div>
          <div class="barlabel"><span>${w=='five_hour'?'5-HOUR':'WEEKLY'} ${x.used_pct.toFixed(0)}%</span><span>RESETS ${clock(x.resets_at).toUpperCase()}</span></div>`}
    h+='</div>'}
  $('usage').innerHTML=h;
}

function renderRuns(runs){
  $('runs').innerHTML=runs.map(r=>`<tr>
    <td class="t">${clock(r.started_at)}</td>
    <td><span class="role">${esc(roleName[r.role]||r.role)}</span> <span class="dim">${esc(r.provider)} ${esc(r.model||'')}</span></td>
    <td class="c">${esc(r.task||'')}</td>
    <td><span class="st ${esc(r.status)}">${esc(r.status).toUpperCase()}</span></td>
    <td class="out ${r.outputs.length?'':'none'}">${r.outputs.length?r.outputs.map(o=>esc(o.ref)).join(', '):(r.status=='running'?'<span class="y">IN PROGRESS</span>':'NO OUTPUT')}</td>
    <td class="t">${r.weekly_end!=null&&r.weekly_start!=null?'+'+(r.weekly_end-r.weekly_start).toFixed(1)+'% wk':''}${r.cost_usd?' ~$'+r.cost_usd.toFixed(2):''}</td></tr>`).join('');
}

function renderBoard(items){
  if(!items||items.error){$('board').innerHTML=`<span class="dim">${esc(items&&items.error||'')}</span>`;return}
  const machine=items.filter(i=>!i.labels.includes('owner:human'));
  const has=(i,l)=>i.labels.includes(l);
  const col=(name,cls,test)=>{const xs=machine.filter(test);
    return `<div class="col ${cls}"><h3>${name} ${xs.length}</h3>${xs.map(i=>`<div class="card"><span class="n">#${i.number}</span>${esc(i.title)}</div>`).join('')||'<div class="dim">-</div>'}</div>`};
  $('board').innerHTML=col('Ready','ready',i=>has(i,'status:ready'))+col('In progress','prog',i=>has(i,'status:in-progress'))
    +col('In review','review',i=>has(i,'status:review'))+col('Blocked','blocked',i=>has(i,'status:blocked'));
}

async function refresh(){
  let d;try{const r=await fetch('/api/state',{cache:'no-store'});d=await r.json()}catch(e){return}
  if(pageVersion===null)pageVersion=d.version;else if(d.version!==pageVersion){location.reload();return}
  $('projBig').textContent=(d.project.name||'Common Room')+' studio';$('proj').textContent=d.project.repo||'';
  const m=d.milestone;
  if(m&&!m.error){const total=m.open_issues+m.closed_issues;$('goalName').textContent=d.goal;blocks($('goalBlocks'),total?m.closed_issues/total:0);
    $('goalMeta').textContent=`${m.closed_issues}/${total} DONE${m.due_on?' · DUE '+m.due_on.slice(0,10):''}`}
  else $('goalName').textContent=d.goal||'no goal set';
  beacon(d);renderQueue(d.owner_queue);renderProof(d.proof);renderUsage(d.usage);renderRuns(d.runs);renderBoard(d.board);
  const w=d.worker;$('feedHead').textContent=w?`${w.file} · ${w.count} events · updated ${ago(w.updated)} ago`:'No worker activity yet';
  $('feed').textContent=w?w.events.join('\n'):'';const f=$('feed');f.scrollTop=f.scrollHeight;
  const paused=d.breakers.some(b=>b.kind=='paused_by_owner');$('pause').textContent=paused?'Resume autonomy':'Pause autonomy';$('pause').dataset.paused=paused?'1':'';
  $('breakers').innerHTML=d.breakers.filter(b=>b.kind!='paused_by_owner').map(b=>`<div class="breaker">STOPPED: ${esc(b.kind)}: ${esc(b.detail)}</div>`).join('');
}
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Room':'1'},body:JSON.stringify(body||{})});return r.json()}
$('pause').onclick=async()=>{await post($('pause').dataset.paused?'/api/resume':'/api/pause');refresh()};
$('suggest').onsubmit=async e=>{e.preventDefault();const t=e.target.title.value.trim();if(!t)return;const res=await post('/api/suggest',{title:t});
  if(res.url){e.target.title.value='';e.target.title.placeholder='Filed. The director will triage it'}else alert('Failed: '+res.error)};
refresh();setInterval(refresh,8000);
</script>
</body>
</html>
