<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Common Room</title>
<style>
body{margin:0;overflow-wrap:anywhere;font:16px/1.4 system-ui,sans-serif;color:#222;background:#fff}
main{box-sizing:border-box;max-width:46rem;margin:0 auto;padding:1rem}
h1{font-size:1.2rem;margin:0 0 .5rem}
h2{font-size:1rem;margin:1.5rem 0 .4rem;border-bottom:1px solid #ccc}
p{margin:.3rem 0}
.dim{color:#666}
.bad{color:#a00;font-weight:600}
.row{margin:.5rem 0}
.row .top{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.bar{position:relative;height:.8rem;background:#e6e6e6;margin:.2rem 0}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#36c}
.bar.over i{background:#c60}
.bar b{position:absolute;top:-.2rem;bottom:-.2rem;width:2px;background:#000}
details{margin:.4rem 0}
summary{cursor:pointer}
ul{margin:.3rem 0;padding-left:1.2rem}
</style>
</head>
<body>
<main>
<h1>Common Room</h1>
<p id="week" class="dim">Loading...</p>
<p id="verdicts"></p>
<h2>The pie</h2>
<div id="pie"></div>
<h2>Waiting on you</h2>
<div id="waiting"></div>
<h2>Projects</h2>
<div id="projects"></div>
<p class="dim">est. = an estimate: the weekly meter covers the whole plan, so each part is inferred.</p>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
function el(tag, text, cls, parent) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  if (parent) parent.appendChild(e);
  return e;
}
const when = t => new Date(t * 1000).toLocaleString([], {weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
const ago = s => s < 90 ? "just now" : s < 5400 ? Math.round(s / 60) + " minutes old" : s < 172800 ? Math.round(s / 3600) + " hours old" : Math.round(s / 86400) + " days old";
const pct = n => (n == null ? "-" : n.toFixed(1) + "%");

function render(d) {
  const w = $("week");
  w.className = "";
  if (!d.week) {
    w.className = "dim";
    w.textContent = "No current weekly reading.";
  } else {
    w.textContent = `${d.week.week_gone_pct.toFixed(0)}% of the week gone, ${d.week.plan_used_pct.toFixed(0)}% of the plan used, resets ${when(d.week.resets_at)}. Reading ${ago(d.week.reading_age_seconds)}.`;
    if (d.week.stale) el("span", " Stale: use since then is not counted.", "bad", w);
  }
  const v = $("verdicts");
  v.textContent = "";
  el("span", "Gate: " + (d.gate.go ? "go" : "hold") + ", " + d.gate.reason + ". ", null, v);
  if (d.pie) el("span", "Pie: " + (d.pie.go === null ? "" : d.pie.go ? "go, " : "hold, ") + d.pie.reason + ".", null, v);
  if (d.error) el("p", d.error, "bad", v);

  const pie = $("pie");
  pie.textContent = "";
  if (!d.registered) el("p", "No projects are registered, so there is no pie. Showing the one project this page is started for.", "dim", pie);
  for (const r of d.rows) {
    const row = el("div", null, "row", pie);
    const top = el("div", null, "top", row);
    el("span", `${r.name}: ${r.state}`, null, top);
    const money = r.room_est == null ? "" : ` (room ${pct(r.room_est)}, own sessions ${pct(r.own_sessions_est)})`;
    el("span", `share ${r.share}%, spent est. ${pct(r.spent_est)}${money}, line ${pct(r.line)}`, "dim", top);
    const bar = el("div", null, "bar" + (r.state === "over" ? " over" : ""), row);
    const cap = Math.max(r.share, r.line, r.spent_est, 1);
    el("i", null, null, bar).style.width = Math.min(100, 100 * r.spent_est / cap) + "%";
    el("b", null, null, bar).style.left = Math.min(99, 100 * r.line / cap) + "%";
  }

  if (d.registered) editor(pie, d.rows.filter(r => r.work), d.rows.find(r => r.work === null));

  const wt = $("waiting");
  wt.textContent = "";
  if (!d.waiting.length) el("p", "Nothing is waiting on you.", "dim", wt);
  else {
    const ul = el("ul", null, null, wt);
    for (const t of d.waiting.slice(0, 8)) {
      const li = el("li", null, null, ul);
      const a = el("a", `#${t.number} ${t.title}`, null, li);
      if (/^https:\/\//.test(t.url || "")) a.href = t.url;
      el("span", ` (${t.project}${t.due ? ", due " + t.due : ""})`, "dim", li);
    }
    if (d.waiting.length > 8) el("p", `and ${d.waiting.length - 8} more`, "dim", wt);
  }

  const pj = $("projects");
  pj.textContent = "";
  for (const p of d.projects) {
    const det = el("details", null, null, pj);
    el("summary", `${p.name}: ${p.status.text}${p.status.until ? " " + when(p.status.until) : ""}`, null, det);
    el("p", p.landed_7d ? `Landed in the last 7 days: ${p.landed_7d} (latest ${p.landed_recent.join(", ")}).` : "Nothing landed in the last 7 days.", null, det);
    if (p.breakers.length) for (const b of p.breakers) el("p", `Stopped since ${when(b.since)}: ${b.words}`, "bad", det);
    else el("p", "No open breakers.", "dim", det);
    if (p.trail) {
      const tr = el("details", null, null, det);
      el("summary", `Trail (${p.trail.length})`, null, tr);
      if (p.trail_error) el("p", `The board can't be read: ${p.trail_error}`, "bad", tr);
      if (!p.trail.length) el("p", "No notes from you in the last 14 days.", "dim", tr);
      for (const n of p.trail) {
        el("p", `${when(n.at)}  ${n.first_line}`, null, tr);
        const ul = el("ul", null, null, tr);
        for (const i of n.items) el("li", `#${i.number} ${i.title}: ${i.state === "open" ? "open" : i.merged ? "landed" : "closed"}`, null, ul);
        if (!n.items.length) el("li", p.trail_error ? "items unknown" : "no item yet", "dim", ul);
      }
    }
    const nb = el("div", null, null, det);
    const box = el("textarea", null, null, nb);
    box.rows = 3; box.maxLength = 8000; box.placeholder = "Note to this project";
    const kind = el("select", null, null, nb);
    for (const k of ["", "outcome", "bound", "decision", "suggestion", "correction"]) el("option", k || "no kind", null, kind).value = k;
    const send = el("button", "Note to this project", null, nb);
    const sent = el("span", "", "dim", nb);
    send.onclick = async () => {
      sent.textContent = "Sending...";
      try {
        const r = await fetch("/api/note", {method: "POST", headers: {"X-Room": "1"},
          body: JSON.stringify({project: p.name, text: box.value, kind: kind.value || undefined})});
        const j = await r.json();
        sent.textContent = j.error ? " " + j.error : " Saved as " + j.name;
        if (!j.error) box.value = "";
      } catch (e) { sent.textContent = " Not sent: " + e; }
    };
    el("a", "details", null, det).href = "/api/state";
  }
}

// Sliders and mode per project. Nothing is saved until Apply; the preview shows the pie as it would be.
function editor(parent, rows, owner) {
  const box = el("div", null, "row", parent);
  el("p", "Change the shares", "dim", box);
  const ctl = {};
  const preview = el("p", null, null, box);
  const msg = el("p", null, "dim", box);
  const apply = el("button", "Apply", null, box);
  const draft = () => rows.filter(r => {
    const c = ctl[r.name];
    return +c.slider.value !== r.share || c.work.value !== r.work || c.when.value !== r.when;
  });
  const show = () => {
    for (const r of rows) ctl[r.name].out.textContent = ctl[r.name].slider.value + "%";
    const total = rows.reduce((t, r) => t + +ctl[r.name].slider.value, 0);
    const mine = Math.round((100 - total) * 10) / 10;
    const cur = `Now: ${rows.map(r => r.name + " " + r.share + "%").join(", ")}, you ${owner ? owner.share : "-"}%.`;
    const next = `After Apply: ${rows.map(r => r.name + " " + ctl[r.name].slider.value + "%").join(", ")}, you ${mine}%.`;
    preview.textContent = draft().length ? cur + " " + next : cur + " No change.";
    apply.disabled = !draft().length;
  };
  for (const r of rows) {
    const line = el("div", null, "top", box);
    el("span", r.name, null, line);
    const c = ctl[r.name] = {};
    c.slider = el("input", null, null, line);
    c.slider.type = "range"; c.slider.min = 0; c.slider.max = 100; c.slider.step = 1; c.slider.value = r.share;
    c.out = el("span", null, "dim", line);
    c.work = el("select", null, null, line);
    for (const k of ["fixed", "open"]) el("option", k, null, c.work).value = k;
    c.work.value = r.work;
    c.when = el("select", null, null, line);
    for (const k of ["paced", "spare"]) el("option", k, null, c.when).value = k;
    c.when.value = r.when;
    for (const k of ["slider", "work", "when"]) c[k].oninput = show;
  }
  show();
  apply.onclick = async () => {
    msg.textContent = "Applying...";
    try {
      for (const r of draft()) {
        const c = ctl[r.name];
        const res = await fetch("/api/project", {method: "POST", headers: {"X-Room": "1"},
          body: JSON.stringify({project: r.name, share: +c.slider.value, work: c.work.value, when: c.when.value})});
        const j = await res.json();
        if (j.error) { msg.textContent = `${r.name}: ${j.error}`; return; }
      }
      msg.textContent = "Applied.";
      load(true);
    } catch (e) { msg.textContent = "Not applied: " + e; }
  };
}

async function load(force) {
  try {
    const r = await fetch("/api/page", {cache: "no-store"});
    const d = await r.json();
    if (force === true || (![...document.querySelectorAll("textarea")].some(t => t.value) && !document.querySelector("input[type=range]:focus"))) render(d);   // a half-written note is not wiped by the refresh
  } catch (e) {
    $("week").textContent = "The room's dashboard can't be reached: " + e;
  }
}
load();
setInterval(() => load(), 30000);
</script>
</body>
</html>
