[project]
name = "commonroom"
version = "2.0.0"
description = "Goal-driven AI studio: usage gating, ledger and dispatch for Claude Code and Codex workers"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pty = ["pywinpty>=2; sys_platform == 'win32'", "pyte>=0.8"]

[project.scripts]
room = "commonroom.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["commonroom*"]
