# Common Room as a project of its own: the room builds, reviews and merges its own improvements (commonroom#31).
# The heartbeat ticks this project's dispatcher next to the game's. See docs/design.md, "The room serves itself".
[project]
name = "commonroom"
repo = "kgaydhani/commonroom"
mission = "Keep the studio improving itself: every autonomous run lands real output, allowance goes where the goal needs it, and nothing the owner relies on breaks."
# Dispatcher-made worktrees live outside the live checkout (D:/Dev/commonroom), which the room runs from and never edits.
worktrees = "D:/Dev/commonroom-wt/room"

[goal]
milestone = "Room v3: the room improves itself"

[share]
# A guest on the game's plan. It uses the host's budget gate (reserves, pace, burn cap, owner yield are read from the
# host's room.toml at load, so they can't drift apart) and stops when the host's room-wide breakers are open.
host = "D:/Dev/gamemirage"
# The game keeps moving: this project's model runs take at most 15% of all autonomous run time per provider over the
# trailing 24 h, unless no other project has used that provider for an hour (then nobody is waiting on it).
max = 0.15
hours = 24
idle_minutes = 60

[checks]
test = "python -m unittest discover -s tests"
# No GitHub CI on this repo. Housekeeping merges on the reviewer's `REVIEW: APPROVE` posted after the last commit,
# when it carries `TESTS: PASS <head sha> <test command>: <result>`, and merges one PR per pass.
ci = false

[merge]
# The room merges its own PRs, so a change to what it may spend or what stops it also needs the director's
# `[agent:director] REVIEW: APPROVE` after the last commit (commonroom#49). A glob can't pick out just the budget parts
# of config.py, so the whole file is in.
director_paths = ["commonroom/gate.py", "commonroom/config.py", "room.toml"]

[roles]
# All Claude: one Claude dispatcher serves this project. Codex's build prompt and sandbox are set up for the game.
director = ["claude:opus"]
# Director 2026-10-14 (#119): the weekly Claude allowance is the limit, and size:S builds with written criteria are
# routine. Sonnet builds them, and Opus still builds size:L/risk:high/builder:heavy and reviews everything. Back to
# Opus if 2 of the first 5 Sonnet builds are bounced for correctness, or one breaks main or the live room.
builder = ["claude:sonnet"]
builder_heavy = ["claude:opus"]
reviewer = ["claude:opus"]
reviewer_high_risk = ["claude:opus"]
scout = ["claude:opus"]
codex_parallel_builds = false

[parallel]
# One slot: the heartbeat starts a single Claude dispatcher for this project.
claude_slots = 1

[director]
# Director 2026-10-10: the room's own director used 23% of its 15% share (5 runs, 29 min in 24 h) while builds waited 1.5-3.5 h
# for review. Steer every 6 h here; the game keeps 3 h. Escalations still wake it at once.
# Director 2026-10-12 (#104): at 6 h it still took 34% of this project's spend ($3.42 of $10.11 in 24 h) while the project sat
# at its share cap. An empty ready queue, escalations and suggestions still wake it at once, so steer every 12 h.
# Director 2026-10-15 (#122): at 12 h it was still 44% of this project's spend ($4.27 of $9.75 in 72 h, 6 runs) while
# builders and reviewers made all 8 merges. Events still wake it at once. Back to 12 if the ready queue sits empty > 6 h.
steer_every_hours = 24
