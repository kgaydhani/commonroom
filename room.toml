# Common Room as a project of its own: the room builds, reviews and merges its own improvements (commonroom#31).
# The heartbeat ticks this project's dispatcher next to the host project's. See docs/design.md, "The room serves itself".
[project]
name = "commonroom"
repo = "kgaydhani/commonroom"
mission = "Keep the studio improving itself: every autonomous run lands real output, allowance goes where the goal needs it, and nothing the owner relies on breaks."
# Dispatcher-made worktrees live outside the live checkout (D:/Dev/commonroom), which the room runs from and never edits.
worktrees = "D:/Dev/commonroom-wt/room"

[goal]
milestone = "Room v3: the room improves itself"

[share]
# A guest on the host project's plan. It uses the host's budget gate (reserves, pace, burn cap, owner yield are read
# from the host's room.toml at load, so they can't drift apart) and stops when the host's room-wide breakers are open.
# The host is the project the heartbeat runs for (it sets COMMONROOM_HOST, commonroom#151); this path is the fallback
# for commands run by hand. Owner 2026-10-22: the magazine is the host, gamemirage is paused.
host = "D:/Dev/magazine"
# The host keeps moving: this project's model runs take at most 15% of all autonomous run time per provider over the
# trailing 24 h, unless no other project has used that provider for an hour (then nobody is waiting on it).
max = 0.15
hours = 24
idle_minutes = 60

[checks]
# One process per test module, in parallel (#421, #422). Approvals naming the old serial command still count (also_accept).
test = "python tests/parallel.py"
also_accept = ["python -m unittest discover -s tests"]
# No GitHub CI on this repo. Housekeeping merges on the reviewer's `REVIEW: APPROVE` posted after the last commit,
# when it carries `TESTS: PASS <head sha> <test command>: <result>`, and merges one PR per pass.
ci = false
# The room runs the suite on a PR head before any reviewer starts; a failing head goes straight back to its builder (#210).
test_before_review = true

[merge]
# The room merges its own PRs, so a change to what it may spend or what stops it also needs the director's
# `[agent:director] REVIEW: APPROVE` after the last commit (commonroom#49). A glob can't pick out just the budget parts
# of config.py, so the whole file is in.
director_paths = ["commonroom/gate.py", "commonroom/config.py", "room.toml", "commonroom/ways/policy.toml"]
# A PR that only adds lines to policy.toml (a new tunable) needs no stamp; a changed or removed line still does (#672).
director_paths_additive = ["commonroom/ways/policy.toml"]
# An approval survives clean merges of main once the room has run the tests on the merged head itself, so a merge of
# main costs no reviewer run (commonroom#226). Runs are bounded by [checks] max_minutes, 10 when unset.
carry_tested_approval = true

[roles]
# Claude builds and reviews. Codex takes parallel routine builds (codex_parallel_builds below); Claude Opus reviews them.
director = ["claude:opus"]
# Director 2026-10-14 (#119): the weekly Claude allowance is the limit, and size:S builds with written criteria are
# routine. Sonnet builds them, and Opus still builds size:L/risk:high/builder:heavy and reviews everything. Back to
# Opus if 2 of the first 5 Sonnet builds are bounced for correctness, or one breaks main or the live room.
builder = ["claude:sonnet"]
builder_heavy = ["claude:opus"]
reviewer = ["claude:opus"]
reviewer_high_risk = ["claude:opus"]
scout = ["claude:opus"]
# Director 2026-11-21 (#275): Codex had a whole week unused while Claude was at 49% with 28% of the week gone. Codex
# takes the second routine ready task (never size:L, risk:high or builder:heavy) and Claude Opus reviews and tests it.
# Back to false if 2 of the first 4 Codex builds are bounced for correctness, or one breaks main or the live room.
codex_parallel_builds = true

[prompts]
codex = "Seven of this repo's tests fail only inside the Codex sandbox (commonroom#184): the git clone/push tests in test_self_serve.LiveCheckout and test_dispatch (msys sh.exe CreateFileMapping), two test_scratch_env tests that write outside the worktree, and test_another_projects_workers_are_not_the_owner. If those are your only failures, push and name them in the PR; the reviewer runs the suite outside the sandbox."

[parallel]
# One slot: the heartbeat starts a single Claude dispatcher for this project.
claude_slots = 1

[director]
room_findings = true
# Director 2026-10-10: the room's own director used 23% of its 15% share (5 runs, 29 min in 24 h) while builds waited 1.5-3.5 h
# for review. Steer every 6 h here; the game keeps 3 h. Escalations still wake it at once.
# Director 2026-10-12 (#104): at 6 h it still took 34% of this project's spend ($3.42 of $10.11 in 24 h) while the project sat
# at its share cap. An empty ready queue, escalations and suggestions still wake it at once, so steer every 12 h.
# Director 2026-10-15 (#122): at 12 h it was still 44% of this project's spend ($4.27 of $9.75 in 72 h, 6 runs) while
# builders and reviewers made all 8 merges. Events still wake it at once. Back to 12 if the ready queue sits empty > 6 h.
steer_every_hours = 24
# The director's prompt carries the code-built project digest, cut to this many characters (commonroom#345).
digest_chars = 4000
# A run that only stamps director-path PRs judges a few lines after a reviewer approved: medium effort (commonroom#342).
stamp_effort = "medium"
